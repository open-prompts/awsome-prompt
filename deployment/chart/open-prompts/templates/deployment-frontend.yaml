apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-prompts.fullname" . }}-frontend
  labels:
    {{- include "open-prompts.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "open-prompts.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "open-prompts.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # Point nginx at the backend Kubernetes Service. The nginx.conf
            # template resolves this hostname at request time, so nginx can
            # start even if the backend is not ready yet.
            - name: BACKEND_HOST
              value: "{{ include "open-prompts.fullname" . }}-backend"
            # kube-dns ClusterIP; nginx uses it to resolve BACKEND_HOST on
            # each request. An IP avoids any startup-time DNS dependency.
            - name: NGINX_RESOLVER
              value: "{{ .Values.frontend.nginxResolver }}"
