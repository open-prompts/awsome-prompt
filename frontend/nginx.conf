server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Resolve the backend hostname at request time instead of at startup,
    # so nginx can boot even if the backend service is temporarily
    # unavailable or being restarted. In Kubernetes this points at kube-dns;
    # in docker-compose at Docker's embedded DNS (127.0.0.11). The values
    # are injected via the NGINX_RESOLVER / BACKEND_HOST env vars (see
    # Dockerfile template).
    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to background service
    location /api/ {
        # NOTE: proxy_pass with a variable defers DNS resolution to request
        # time. BACKEND_HOST is set in docker-compose (the compose service
        # name "backend") and in the Helm chart to the actual Kubernetes
        # Service name (e.g. open-prompts-backend).
        set $backend_upstream http://${BACKEND_HOST}:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Gzip compression
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Optional: Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
